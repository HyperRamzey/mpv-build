# ==============================================================================
   # Video Renderer and Decode Path
   # ==============================================================================
   vo=gpu-next
   gpu-api=d3d11
   gpu-context=d3d11
   hwdec=d3d11va
   d3d11-output-format=rgb10_a2

   # ==============================================================================
   # Audio Path
   # ==============================================================================
   ao=wasapi
   audio-exclusive=yes
   lavfi-complex="amovie=mpv/ir.wav[ir];[aid1][ir]afir=irfmt=mono[ao]"
   # ==============================================================================
   # Dithering
   # ==============================================================================
   dither-depth=10
   dither=error-diffusion

   # ==============================================================================
   # Scaling Quality
   # ==============================================================================
   scale=ewa_lanczossharp
   cscale=ewa_lanczossharp
   dscale=mitchell
   scale-antiring=0.6
   cscale-antiring=0.6

   # ==============================================================================
   # Default Desktop Policy: SDR Stays SDR
   # ==============================================================================
   target-colorspace-hint=auto

   deband=yes
   deband-iterations=2
   deband-threshold=48
   deband-range=16
   deband-grain=24

   # ==============================================================================
   # HDR Profile: HDR Enables HDR (conditional)
   # ==============================================================================
   [HDR]
   profile-desc=Enable HDR output policy for PQ or HLG sources
   profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
   profile-restore=copy

   target-colorspace-hint=yes
   target-colorspace-hint-mode=source-dynamic
   target-trc=pq
   target-prim=bt.2020
   target-gamut=bt.2020           # or dci-p3 if your monitor is P3-limited
   target-peak=700                # Adjust to your monitor's actual peak nits
   target-contrast=inf
   video-sync=audio

   gamut-mapping-mode=perceptual
   tone-mapping=spline
   hdr-compute-peak=no
   hdr-peak-percentile=99.995
   hdr-contrast-recovery=0.30

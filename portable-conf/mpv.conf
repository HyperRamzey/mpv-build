# ==============================================================================
# Video Renderer and Decode Path
# ==============================================================================
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
hwdec=d3d11va
d3d11-output-format=rgb10_a2

# ==============================================================================
# Audio Path — headphone correction ONLY (no spatial rendering)
# ==============================================================================
ao=wasapi
audio-exclusive=yes
audio-channels=7.1,5.1
# linear-phase headphone correction (ir.wav, f32 mono 48k) applied
# per-channel — GATED OFF in this released config: uncomment to re-enable.
# ir.wav ships in the mpv/ config folder (mpv/ir.wav) so nothing is lost;
# the line below is your current tuning (fixed 4096-tap partition, double
# precision) and works as-is when mpv is started from the bundle root, i.e.
# with the working directory set to the folder that CONTAINS mpv/.
# NOTE: the amovie= path is resolved by FFmpeg against the PROCESS working
# directory, NOT against this config file's folder (~~/ is not expanded
# inside a lavfi filter string). Launching from anywhere else -- e.g. a
# shortcut with a different "Start in", or a file manager, or
# `mpv --include=<abs>/mpv.conf` from another dir -- gives
#   [ffmpeg] Failed to avformat_open_input 'mpv/ir.wav'
#   [ffmpeg] AVFilterGraph: Error initializing filters
# and mpv exits 2 before playing anything. If you launch that way, either
# cd into the bundle root first or replace the path with an absolute one.
# lavfi-complex=amovie=mpv/ir.wav[ir2];[aid1][ir2]afir=irfmt=mono:irnorm=-1:wet=1:minp=4096:maxp=4096:precision=double[ao]

# ==============================================================================
# Dithering
# ==============================================================================
dither-depth=10
dither=fruit
# Kernel for error-diffusion. mpv's own documented default is sierra-lite
# ("fast with reasonable quality"); burkes is what the manual itself calls
# "a good balance between performance and quality... probably the one you
# want to try first" among the heavier kernels. There's no literal
# --dither=blue in mpv (the accepted values are fruit|ordered|error-diffusion|
# no) -- "blue noise" isn't a selectable mode here. Also worth knowing:
# libplacebo's own docs say error-diffusion is really meant for still images,
# not moving video (it's the heaviest mode, and mpv silently falls back to
# dither=fruit if the GPU lacks enough shared memory for your window height).
# If you see shimmer during playback, dither=fruit (mpv's own default,
# noise-based, no compute-shader requirement) is the usual video-friendly pick.

# ==============================================================================
# Scaling Quality
# ==============================================================================
# Luma upscaling: EWA Lanczos "sharp" — mpv's manual calls ewa_lanczos
# "Elliptic weighted average Lanczos scaling. Also known as Jinc", and
# ewa_lanczossharp is the sharpened variant, i.e. "JincAR sharp".
# scale-radius pins the kernel to a true 3-tap filter (3.2383154841662362 is
# the exact 3rd zero-crossing of the jinc function, not a rounded "3" —
# per mpv devs' own numbers). The manual notes the radius actually used can
# still be nudged slightly by the renderer depending on scale ratio.
scale=ewa_lanczossharp
scale-radius=3.2383154841662362

# Chroma upscaling base filter (cscale in mpv is upscaling-only — chroma is
# always upsampled to luma resolution before any final downscale). Paired
# below with the KrigBilateral shader for the actual "bilateral" reconstruction.
cscale=ewa_lanczossharp
cscale-radius=3.2383154841662362

# Downscaling: mitchell, changed back from EWA/Jinc (2026-09-01) after
# checking three independent sources that all agree on this for a real
# playback scenario at your actual downscale ratio (2160→1440, 1.5x):
#   - mpv's own "high-quality" builtin profile inherits dscale=mitchell from
#     its "default" profile and only overrides scale=/cscale=, never dscale=
#     (github.com/mpv-player/mpv commit 703f158, "modernize internal profiles")
#   - Artoriuz's filter analysis: "Using polar filters to downscale in mpv is
#     very resource intensive and generally just unnecessary" — mpv itself
#     defaults to Hermite, which doesn't ring at all
#     (artoriuz.github.io/blog/mpv_upscaling.html)
#   - The current (2026) high-end gpu-next config guide on carlosfelic.io
#     independently lands on the same dscale=mitchell for the same reasons
# EWA/Jinc downscaling is real and mpv will run it, it's just heavier for a
# ratio this small with no clearly demonstrated quality win. If you still want
# the literal Jinc-for-downscale behavior, change the line below back to:
#   dscale=ewa_lanczos
dscale=mitchell
linear-downscaling=no          # required by the shader
correct-downscaling=yes

scale-antiring=0.6
cscale-antiring=0.6
# dscale-antiring is currently inert: mitchell is a separable/orthogonal
# filter, and the manual disables dscale-antiring for those on gpu-next (it
# only has an effect when dscale is a polar/EWA filter, e.g. ewa_lanczos).
# Left set at 0.6 so it's already correct if you revert dscale above.
dscale-antiring=0.6

# Scale in sigmoidal light to avoid emphasizing ringing when upscaling.
# This is already mpv's default — set explicitly here since you asked for it.
sigmoid-upscaling=yes

# ==============================================================================
# Advanced Upscaling / Super-Resolution Shaders
# ==============================================================================
# FSRCNNX removed (2026-09-01): dropped per request. KrigBilateral.glsl is the
# well-known guided "bilateral" chroma-from-luma reconstruction shader — this
# is what "bilateral chroma scaling" actually refers to; there is no built-in
# cscale=bilateral in mpv or libplacebo (confirmed against the current mpv
# manual — it isn't in the option list). Canonical source for the shader:
#   https://gist.github.com/igv/a015fc885d5c22e6891820ad89555637
# "~~/" always expands to wherever mpv actually loaded THIS mpv.conf from, so
# dropping the file next to mpv.conf itself (no "shaders/" subfolder) and
# referencing it as below will resolve correctly regardless of the exact
# mechanism (portable_config, --config-dir, etc.) that pointed mpv here.
glsl-shaders="~~/CfL_Prediction.glsl"
glsl-shaders-append="~~/SSimDownscaler.glsl"

# NVIDIA VSR + hqdn3d moved out of the unconditional default path (2026-09-15)
# — see the [lowres-enhance] profile below. They now only apply to sources at
# or below 1080p, for both SDR and HDR, and only there.

# Kept independent of FSRCNNX: rgba16hf gives the intermediate render passes
# more headroom than the default 8-bit-equivalent FBOs, which reduces banding
# risk once you're stacking ewa_lanczossharp + deband + dithering on a 10-bit
# output. Worth keeping even with FSRCNNX gone.
fbo-format=rgba16hf

# ==============================================================================
# Default Desktop Policy: SDR Stays SDR
# ==============================================================================
target-colorspace-hint=auto

deband=no
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=24

# ==============================================================================
# HDR Profile: HDR Enables HDR (conditional)
# ==============================================================================
[HDR]
profile-desc=Enable HDR output policy for PQ or HLG sources
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
# hqdn3d moved out of this profile (2026-09-17) into [HDR-denoise] below —
# see that profile for why. Everything else in [HDR] is unaffected.
target-colorspace-hint=yes
target-colorspace-hint-mode=target
target-trc=pq
image-subs-hdr-peak=2000
blend-subtitles=video
sub-hdr-peak=50
# target-prim is the signaling primaries sent to the display (bt.2020 is
# standard HDR10 container signaling regardless of what the panel can
# actually reproduce) — left as-is, this part was already correct.
target-prim=bt.2020
# target-gamut is different: it tells the gamut-mapping algorithm what the
# display can ACTUALLY reproduce. No consumer OLED — 27" 1440p or otherwise —
# covers full bt.2020 in 2026; even the best QD-OLED panels land around
# ~95-99% DCI-P3, which is only a fraction of bt.2020. Leaving this at
# bt.2020 tells the mapper to under-compress saturated colors it can't
# actually show. dci-p3 is the realistic assumption for this display class.
target-gamut=display-p3
# target-peak=auto queries the peak brightness your OLED itself reports over
# HDMI/DP (via Windows' Advanced Color info) instead of a hardcoded guess, so
# it tracks whatever your specific 27" panel actually is. Falls back to a
# generic assumption if that query isn't available for some reason — if you
# ever see washed-out or oddly dim HDR, try setting this to your panel's
# actual spec'd peak nits (check your monitor's page) instead.
target-peak=auto
target-contrast=inf
video-sync=audio

gamut-mapping-mode=perceptual
# Switched back from tone-mapping=clip (2026-09-01). Clip is accurate for
# in-range values but hard-crushes everything above target-peak with zero
# roll-off — and 4K UHD Blu-ray remuxes are routinely mastered at 1000-4000
# nits, far above what any 27" 1440p OLED sustains, so clip would flatten a
# lot of real highlight detail on exactly the kind of source you're asking
# about. spline is mpv/libplacebo's current well-regarded general-purpose
# curve: it compresses out-of-range highlights smoothly instead of cutting
# them off. This also means hdr-peak-percentile and hdr-contrast-recovery
# below (which only apply to compute-peak + spline) stop being inert and
# actually take effect.
# If you deliberately want the old accurate-but-clipped look back:
#   tone-mapping=clip
#   hdr-compute-peak=no
tone-mapping=spline
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30

# ==============================================================================
# HDR Denoise: hqdn3d for HDR sources, EXCEPT Dolby Vision Profile 7
# dual-layer (BL+EL / "FEL") — split out of [HDR] on 2026-09-17
# ==============================================================================
# Your -v log on the Project Hail Mary 2160p DV remux showed this exact
# sequence for the plain hqdn3d that used to live in [HDR]:
#   [vf] [hqdn3d] 3840x2160 d3d11[p010] dolbyvision/bt.2020/pq/...
#   [lavfi] Configuring hwdec_interop=d3d11va for filter graph: hqdn3d
#   [ffmpeg] Impossible to convert between the formats supported by the
#            filter 'mpv_src_default_in' and the filter 'auto_scale_0'
#   [lavfi] failed to configure the filter graph
#   [vf] Disabling filter hqdn3d.00 because it has failed.
# This is NOT the NVIDIA VSR/d3d11vpp filter's fault — d3d11vpp was never
# in the chain at this point (lowres-enhance had already correctly
# excluded itself for a 3840-wide source, restored well before this).
# It's hqdn3d alone failing to download the frame from the GPU. The log
# also shows this file uses mpv's newer dual-layer Dolby Vision Profile 7
# ("FEL") decode path — "Dolby Vision Profile 7 splitter: BL stream 0,
# virtual EL stream 1 (dependent_track)" and the "el_pair" filter that
# recombines the base+enhancement layers. That combined frame is
# apparently not (yet, as of this Sep 2026 mpv dev build) something the
# auto-inserted hwdownload/scale step can read out to hand to a software
# filter — the "Impossible to convert" + immediate "Disabling filter"
# pattern is the same shape mpv has historically shown whenever
# hwdownload can't read a specific hw-surface type, just triggered here
# by the brand-new EL-pairing path rather than an old vaapi/dxva2 bug.
# It was silently getting dropped every time regardless — this profile
# split just stops it from being attempted (and logged as failing) on
# files where it can't work, while keeping it for ordinary single-layer
# HDR10/HLG/DV5/DV8 sources where it works fine.
# NOTE: verify the exact track-list field name/type in your build before
# relying on this (e.g. `mpv --track-list <file>` or the stats.lua
# overlay) — "track-list/N/dolby-vision-profile" is documented, but this
# reads it via the whole-table form (`p["track-list"]`) inside Lua, which
# isn't something I could test against your actual binary.
[HDR-denoise]
profile-desc=hqdn3d for PQ/HLG sources that are not Dolby Vision Profile 7 dual-layer
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and (function() local tl = p["track-list"]; if not tl then return true end; for _, t in ipairs(tl) do if t.type == "video" and t.selected then return tostring(t["dolby-vision-profile"] or "") ~= "7" end end; return true end)()
profile-restore=copy-equal
vf-add=hqdn3d=luma_spatial=2:chroma_spatial=2:luma_tmp=3:chroma_tmp=2.5

# ==============================================================================
# Low-Resolution Enhance: NVIDIA VSR + hqdn3d, <=1080p only (SDR and HDR)
# ==============================================================================
[lowres-enhance]
profile-desc=NVIDIA VSR upscale + hqdn3d denoise for sources at or below 1080p
# video-params/w is the DECODED frame width (pre-filter), so VSR's own
# 1.333x output resize can't feed back into this condition. 1920 covers
# 1080p; anything 1440p (2560) or 2160p (3840) and up falls through
# untouched, regardless of whether it's SDR or HDR.
# Fallback changed from "or 0" to "or 999999" (2026-09-17): before the
# real video-params exist (the brief window at mpv startup and right
# after a file is opened but before the track is decoded), video-params/w
# is nil. "nil or 0" made the condition (0 <= 1920) true, so auto_profiles
# logged a spurious "Applying auto profile: lowres-enhance" for EVERY
# file, including 2160p ones, before immediately restoring it once the
# real width was known a moment later. It never affected an actual
# rendered frame (the restore always happens first), but it was
# confusing in -v logs and in principle it's one auto_profiles hook
# tick where the vf list briefly contains hqdn3d+d3d11vpp before being
# reverted. "or 999999" makes the fallback fail-safe (unknown resolution
# = treated as NOT lowres) instead of fail-permissive.
profile-cond=(p["video-params/w"] or 999999) <= 1920
# copy-equal (not plain copy) matters here because vf-add is a list-append,
# not a plain value set — this is what lets mpv cleanly drop these two
# filters again the moment you open a 1440p/4K file, instead of leaving
# them stuck on.
profile-restore=copy-equal

# hqdn3d MUST run before d3d11vpp, not after. hqdn3d is a software (lavfi)
# filter and needs the frame downloaded from the GPU; the plain decoder hw
# surface downloads fine, but the surface d3d11vpp produces after VSR
# apparently doesn't (this is the exact cause of the
# "Impossible to convert between the formats supported by ... auto_scale_0"
# error that was silently disabling hqdn3d on every launch). Denoise the
# native-res decode output first, then let VSR upscale the denoised result.
# Caveat (2026-09-17): this ordering fix does NOT explain every occurrence
# of that error message. On a 2160p Dolby Vision Profile 7 dual-layer file,
# the identical "Impossible to convert ... auto_scale_0" / "Disabling
# filter hqdn3d" sequence showed up from hqdn3d ALONE in [HDR-denoise],
# with d3d11vpp nowhere in the chain (this profile never activates above
# 1920 wide) — see [HDR-denoise] above for that separate cause.
vf-add=hqdn3d=luma_spatial=1.5:chroma_spatial=1.5:luma_tmp=3:chroma_tmp=2.5
vf-add=d3d11vpp=scale=1.333333:scaling-mode=nvidia

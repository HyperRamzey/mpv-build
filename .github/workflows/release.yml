---
# ============================================================================
# release.yml — GitHub Actions pipeline mirroring the LOCAL build flow 1:1
#
# Local orchestrator: G:\media-build\mpv-build\build-all.sh (driven
# by the consolidated root entry point G:\media-build\build_all.bat)
#   step 0  clean                    -> CI runners are always fresh (no-op)
#   step 1  git pull ALL sources     -> job: sync-sources
#   step 2  deps x5 (build-deps.sh)  -> job: deps   (matrix from setup job)
#   step 3  libplacebo x5            -> job: deps   (same job, right after)
#   step 4  FFmpeg x5               -> job: ffmpeg (matrix)
#   step 5  mpv x5                   -> job: mpv    (matrix)
#   step 6  verification             -> verify steps in ffmpeg/mpv jobs
#
# The SAME scripts are executed verbatim (build-deps.sh,
# build-libplacebo-*.sh, ffmpeg build-*.sh, mpv build-*.sh, copydlls.sh,
# smoke_test.sh). They hardcode /g/media-build/mpv-build,
# /g/media-build/deps-build and /clang64/... paths, so the runner recreates that
# layout:
#   * ONE repo checkout: this repo (mpv-build) is self-contained — it
#     vendors the dependency framework in deps/ and the FFmpeg per-target
#     build scripts in ffmpeg-scripts/
#   * a materialize step copies deps/ -> g/media-build/deps-build and
#     ffmpeg-scripts/ -> g/media-build/ffmpeg-build (every hardcoded
#     /g/... path resolves exactly like on the local machine)
#   * `subst G: <workspace>\g`  =>  MSYS2 sees /g/media-build/mpv-build etc.
#   * MSYS2 lives wherever setup-msys2 puts it (D:/a/_temp/msys64 on the
#     runner, C:/msys64 locally); /clang64 self-resolves, and recipes
#     derive native paths via cygpath -m (never hardcode the root)
#
# Companion repo (the ONLY other repo needed): HyperRamzey/ffmpeg-releases
# — the FFmpeg-only release pipeline, which checks out THIS repo the same
# self-contained way. Two repos total.
#
# CUDA: NOT installed. FFmpeg is configured with --enable-cuda-llvm:
# configure compiles CUDA kernels with clang's NVPTX backend using
# ffmpeg's own compat/cuda/cuda_runtime.h (-nocudainc -nocudalib
# --cuda-device-only), so no toolkit headers/libs are required at build
# time (verified against ffmpeg/configure: check_nvcc runs $nvcc=clang).
# The CUDA_PATH/PATH exports in the ffmpeg scripts are kept verbatim and
# are harmless no-ops when the directory is absent.
# Caching (actions/cache, 10 GB/repo budget, LRU-evicted):
#   src-<run>-<attempt>   all upstream clones: ~90 dep repos + mpv +
#                         ffmpeg + libplacebo   (sync-sources -> all)
#   dpfx-<target>-*       per-target deps prefix + .built-<target>
#                         stamps                (deps -> ffmpeg/mpv)
#   ffinst-<target>-*     per-target FFmpeg install (ffmpeg -> mpv)
# Deps are stamp-cached exactly like locally: only repos whose git HEAD
# moved since the cached build are rebuilt.
#
# Knobs (mirror build-all.sh env knobs):
#   force_deps = true  -> rm stamps + FORCE=1 (rebuild every dependency)
#   deps_lto   = false -> export DEPS_LTO=0 (default = common.sh: LTO on)
#   CLEAN has no equivalent: every CI job starts from a fresh runner.
#   JOBS: ninja/make -j14 is hardcoded in the mpv/ffmpeg scripts (1:1).
# ============================================================================

name: release

"on":
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Space-separated target list to build (default: all eight).
          Hardware targets map to fixed cpu/gpu/cuda gens; the x64v2/v3/v4
          rows are generic ISA levels with the allcuda PTX profile
          (sm_75 PTX 6.3 — the NVIDIA driver JITs to any GPU).
        type: string
        default: "zn3 zn2 11700 3050 14600 x64v2 x64v3 x64v4"
      force_deps:
        description: "Rebuild ALL dependencies (ignore stamp cache)"
        type: boolean
        default: false
      deps_lto:
        description: "Thin-LTO the dependency libs (local default: on)"
        type: boolean
        default: true
      release_tag:
        description: >-
          Optional tag for the GitHub Release (e.g. v2026.07.11).
          Empty = auto-created build-<UTC stamp> tag.
        type: string
        default: ""
  push:
    tags:
      - "v*"
  schedule:
    # weekly full rebuild + release: Sundays 03:00 UTC (steady-state load
    # trough; avoids the top-of-hour GH scheduler crunch). All targets,
    # stamp-cached deps, posts a release like any other run.
    - cron: "0 3 * * 0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  MSYSTEM: CLANG64
  MPV_REPO: https://github.com/mpv-player/mpv.git
  FFMPEG_REPO: https://github.com/FFmpeg/FFmpeg.git
  PLACEBO_REPO: https://code.videolan.org/videolan/libplacebo.git
  # unique per run+attempt: cache keys derived from it never collide
  CACHE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
  # full default target set (dispatch `targets` input overrides; tag
  # pushes fall back to this). Folded scalar keeps lines under 80 cols.
  TARGETS_DEFAULT: >-
    zn3 zn2 11700 3050 14600 x64v2 x64v3 x64v4
  # Target generation table: one row = one hardware gen (name cpu gpu
  # cuda). The dispatch `targets` input selects any subset; the setup
  # job turns the selection into the per-job build matrix.
  # Per-target codegen lives in the scripts (single source of truth):
  #   cpu  -> deps-build common.sh target_env (-march/-mtune)
  #   cuda -> ffmpeg-build build-<t>.sh NVCCFLAGS (clang NVPTX)
  #   install dirs: zn3 ffmpeg = bare `install` (historical), all
  #   others install-<target>; mpv always install-<target>.
  # Generic rows (x64v2/v3/v4) use clang's concrete equivalents of the
  # GCC x86-64-v2/v3/v4 levels (clang rejects the generic names):
  #   v2 = nehalem (SSE4.2)  v3 = haswell (AVX2)  v4 = skylake-avx512,
  # plus the allcuda CUDA profile (sm_75 PTX 6.3 — the NVIDIA driver
  # JITs it to every GPU from Pascal up at runtime).
  TARGET_TABLE: |
    zn3 znver3 Ryzen-5700X3D+RTX-5070-Blackwell sm_120a
    zn2 znver2 Zen2+GTX-1650M-Pascal sm_75
    11700 rocketlake i7-11700+RTX-4080-Ada sm_89
    3050 znver2 Zen2+RTX-3050M-Ampere sm_86
    14600 raptorlake i5-14600+RTX-50-series-Blackwell sm_120a
    x64v2 nehalem generic-x86-64-v2-SSE4.2 allcuda
    x64v3 haswell generic-x86-64-v3-AVX2 allcuda
    x64v4 skylake-avx512 generic-x86-64-v4-AVX-512 allcuda

jobs:
  # ==========================================================================
  # setup: parse TARGET_TABLE (+ optional dispatch `targets` subset) into
  # the per-job build matrix. This is the ONE place target selection is
  # configured; every downstream job consumes matrix.include from here.
  # ==========================================================================
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.mx.outputs.matrix }}
    steps:
      - name: Build target matrix
        id: mx
        shell: bash
        env:
          TARGET_TABLE: ${{ env.TARGET_TABLE }}
          TARGETS_INPUT: ${{ inputs.targets || env.TARGETS_DEFAULT }}
        run: |
          set -euo pipefail
          # rows: <name> <cpu> <gpu-label> <cuda>
          all="$(echo "$TARGET_TABLE" | sed '/^\s*#/d;/^\s*$/d')"
          want="${TARGETS_INPUT:-zn3 zn2 11700 3050 14600 x64v2 x64v3 x64v4}"
          echo "requested targets: $want"
          json="["
          first=1
          while read -r name cpu gpu cuda; do
            [ -n "$name" ] || continue
            # keep only requested targets (tag pushes default to all)
            if ! echo " $want " | grep -q " $name "; then
              echo "skip $name (not requested)"
              continue
            fi
            # zn3 ffmpeg prefix is the historical bare 'install'
            ffdir=install-"$name"
            [ "$name" = zn3 ] && ffdir=install
            sep=,
            [ $first -eq 1 ] && sep=""
            entry="{\"target\":\"$name\",\"cpu\":\"$cpu\",\"gpu\":\"$gpu\","
            entry+="\"cuda\":\"$cuda\",\"install_dir\":\"$ffdir\","
            entry+="\"mpv_dir\":\"install-$name\"}"
            json+="$sep$entry"
            first=0
          done <<< "$all"
          json+="]"
          echo "matrix: $json"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # Lint: bash -n + broken-continuation scan over every build script
  # ==========================================================================
  lint-scripts:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: "Check out mpv-build (self-contained: deps/ + ffmpeg-scripts/)"
        uses: actions/checkout@v6
        with:
          path: g/media-build/mpv-build
      - name: Materialize deps-build + ffmpeg-build from in-repo copies
        shell: bash
        run: |
          set -euo pipefail
          w="$(cygpath -u "$GITHUB_WORKSPACE")/g/media-build"
          cp -r "$w/mpv-build/deps" "$w/deps-build"
          cp -r "$w/mpv-build/ffmpeg-scripts" "$w/ffmpeg-build"
      - name: "Map G: drive"
        shell: pwsh
        run: |
          subst G: "$env:GITHUB_WORKSPACE\g"
          cmd /c dir G:\
      - name: Syntax + continuation scan
        shell: bash
        run: bash /g/media-build/mpv-build/check-scripts.sh

  # ==========================================================================
  # build-all.sh STEP 1: git pull EVERYTHING (~90 dep repos + mpv + ffmpeg
  # + libplacebo). Missing repos are cloned (pull-all.sh / sync_repo).
  # ==========================================================================
  sync-sources:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: "Check out mpv-build (self-contained: deps/ + ffmpeg-scripts/)"
        uses: actions/checkout@v6
        with:
          path: g/media-build/mpv-build
      - name: Materialize deps-build + ffmpeg-build from in-repo copies
        shell: bash
        run: |
          set -euo pipefail
          w="$(cygpath -u "$GITHUB_WORKSPACE")/g/media-build"
          cp -r "$w/mpv-build/deps" "$w/deps-build"
          cp -r "$w/mpv-build/ffmpeg-scripts" "$w/ffmpeg-build"
      - name: "Map G: drive (scripts use hardcoded /g/... paths)"
        shell: pwsh
        run: |
          subst G: "$env:GITHUB_WORKSPACE\g"
          cmd /c dir G:\
      - name: Restore upstream source cache (incremental runs)
        uses: actions/cache@v6
        with:
          path: |
            g/media-build/deps-build/src
            g/media-build/mpv-build/mpv
            g/media-build/mpv-build/libplacebo-src
            g/media-build/ffmpeg-build/ffmpeg
          key: src-${{ env.CACHE_RUN }}
          restore-keys: |
            src-
      - name: Pull all dependency sources (pull-all.sh)
        shell: bash
        run: |
          set -euo pipefail
          # match local machine git config (autocrlf off, LF endings)
          git config --global core.autocrlf false
          git config --global core.eol lf
          bash /g/media-build/deps-build/pull-all.sh
      - name: Pull/clone mpv, FFmpeg, libplacebo (step 1)
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
          sync_repo() {
            local dir="$1" url="$2"
            if [[ -d "$dir/.git" ]]; then
              git -C "$dir" pull --ff-only 2>/dev/null \
                || echo "$(basename "$dir"): pull failed"
            else
              rm -rf "$dir"
              git clone "$url" "$dir"
            fi
          }
          sync_repo /g/media-build/mpv-build/mpv "$MPV_REPO"
          sync_repo /g/media-build/ffmpeg-build/ffmpeg "$FFMPEG_REPO"
          sync_repo /g/media-build/mpv-build/libplacebo-src "$PLACEBO_REPO"
          # libplacebo needs its 3rdparty submodules (glad python package,
          # fast_float, jinja, markupsafe, Vulkan-Headers) for meson setup
          git -C /g/media-build/mpv-build/libplacebo-src submodule update \
            --init --recursive
          echo '--- heads ---'
          git -C /g/media-build/mpv-build/mpv log -1 --oneline
          git -C /g/media-build/ffmpeg-build/ffmpeg log -1 --oneline
          git -C /g/media-build/mpv-build/libplacebo-src log -1 --oneline

  # ==========================================================================
  # build-all.sh STEPS 2+3: dependency matrix + libplacebo, per target.
  # Runs the exact local scripts: build-deps.sh, build-libplacebo-*.sh
  # ==========================================================================
  deps:
    needs: [sync-sources, lint-scripts, setup]
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: "Check out mpv-build (self-contained: deps/ + ffmpeg-scripts/)"
        uses: actions/checkout@v6
        with:
          path: g/media-build/mpv-build
      - name: Materialize deps-build + ffmpeg-build from in-repo copies
        shell: bash
        run: |
          set -euo pipefail
          w="$(cygpath -u "$GITHUB_WORKSPACE")/g/media-build"
          cp -r "$w/mpv-build/deps" "$w/deps-build"
          cp -r "$w/mpv-build/ffmpeg-scripts" "$w/ffmpeg-build"
      - name: "Map G: drive"
        shell: pwsh
        run: |
          subst G: "$env:GITHUB_WORKSPACE\g"
          cmd /c dir G:\
      - name: Install MSYS2 CLANG64 toolchain (local package set)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            autoconf-wrapper
            automake-wrapper
            libtool
            m4
            make
            bison
            flex
            gperf
            patch
            diffutils
            tar
            curl
            which
            nasm
            yasm
            gettext
          pacboy: >-
            clang:p
            meson:p
            ninja:p
            cmake:p
            nasm:p
            python:p
            rust:p
            cargo-c:p
            cython:p
            pkgconf:p
            gettext-runtime:p
            SDL2:p
            zlib:p
            zstd:p
            vulkan-headers:p
            vulkan-loader:p
            opencl-headers:p
      - name: Restore upstream source clones
        uses: actions/cache@v6
        with:
          path: |
            g/media-build/deps-build/src
            g/media-build/mpv-build/mpv
            g/media-build/mpv-build/libplacebo-src
            g/media-build/ffmpeg-build/ffmpeg
          key: src-${{ env.CACHE_RUN }}
          restore-keys: |
            src-
      - name: Restore target prefix + build stamps (incremental)
        uses: actions/cache@v6
        with:
          path: |
            g/media-build/deps-build/deps-${{ matrix.target }}
            g/media-build/deps-build/src/*/.built-${{ matrix.target }}
          key: dpfx-${{ matrix.target }}-${{ env.CACHE_RUN }}
          restore-keys: |
            dpfx-${{ matrix.target }}-
      - name: Pin git line endings for fresh clones
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # on an src- cache miss, build-deps.sh clones ~90 repos here;
          # GH Windows git defaults to autocrlf=true, which would check
          # out CRLF configure scripts and break bash/autotools
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Build dependency matrix (build-all.sh step 2)
        shell: msys2 {0}
        env:
          FORCE_DEPS_INPUT: ${{ inputs.force_deps && '1' || '0' }}
          DEPS_LTO_INPUT: ${{ inputs.deps_lto }}
        run: |
          set -euo pipefail
          export MSYSTEM=CLANG64
          # mirror build-all.sh knob handling
          if [ "${FORCE_DEPS_INPUT:-0}" = "1" ]; then
            rm -f /g/media-build/deps-build/src/*/.built-*
            export FORCE=1
          fi
          # common.sh defaults DEPS_LTO to 1; only explicit false disables
          if [ "${DEPS_LTO_INPUT:-}" = "false" ]; then
            export DEPS_LTO=0
          fi
          bash /g/media-build/deps-build/build-deps.sh ${{ matrix.target }}
      - name: Build libplacebo (build-all.sh step 3)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MSYSTEM=CLANG64
          bash /g/media-build/mpv-build/build-libplacebo-${{ matrix.target }}.sh
      - name: Upload dependency logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-deps-${{ matrix.target }}
          path: g/media-build/deps-build/logs
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # build-all.sh STEP 4: FFmpeg per target (exact local script, incl.
  # its internal copydlls.sh call)
  # ==========================================================================
  ffmpeg:
    needs: [deps, setup]
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: "Check out mpv-build (copydlls + ffmpeg-scripts)"
        uses: actions/checkout@v6
        with:
          path: g/media-build/mpv-build
      - name: Materialize ffmpeg-build from in-repo copy
        shell: bash
        run: |
          set -euo pipefail
          w="$(cygpath -u "$GITHUB_WORKSPACE")/g/media-build"
          cp -r "$w/mpv-build/ffmpeg-scripts" "$w/ffmpeg-build"
      - name: "Map G: drive"
        shell: pwsh
        run: |
          subst G: "$env:GITHUB_WORKSPACE\g"
          cmd /c dir G:\
      - name: Install MSYS2 CLANG64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            autoconf-wrapper
            automake-wrapper
            libtool
            m4
            make
            bison
            flex
            gperf
            patch
            diffutils
            tar
            curl
            which
            nasm
            yasm
            gettext
          pacboy: >-
            clang:p
            meson:p
            ninja:p
            cmake:p
            nasm:p
            python:p
            rust:p
            cargo-c:p
            cython:p
            pkgconf:p
            gettext-runtime:p
            SDL2:p
            zlib:p
            zstd:p
            vulkan-headers:p
            vulkan-loader:p
            opencl-headers:p
      - name: Restore upstream source clones
        uses: actions/cache@v6
        with:
          path: |
            g/media-build/deps-build/src
            g/media-build/mpv-build/mpv
            g/media-build/mpv-build/libplacebo-src
            g/media-build/ffmpeg-build/ffmpeg
          key: src-${{ env.CACHE_RUN }}
          restore-keys: |
            src-
      - name: Restore per-target dependency prefix
        uses: actions/cache@v6
        with:
          path: |
            g/media-build/deps-build/deps-${{ matrix.target }}
            g/media-build/deps-build/src/*/.built-${{ matrix.target }}
          key: dpfx-${{ matrix.target }}-${{ env.CACHE_RUN }}
          restore-keys: |
            dpfx-${{ matrix.target }}-
      - name: Ensure FFmpeg clone exists (cache-miss fallback)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
          if [ ! -d /g/media-build/ffmpeg-build/ffmpeg/.git ]; then
            git clone "$FFMPEG_REPO" /g/media-build/ffmpeg-build/ffmpeg
          fi
      - name: Build FFmpeg (build-all.sh step 4)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MSYSTEM=CLANG64
          bash /g/media-build/ffmpeg-build/build-${{ matrix.target }}.sh
      - name: Verify FFmpeg (build-all.sh step 6)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          FP=/g/media-build/ffmpeg-build/${{ matrix.install_dir }}
          # binary presence is ALWAYS verified; running it is only
          # meaningful when this runner CPU can execute its ISA (e.g.
          # rocketlake AVX-512 SIGILLs on AVX-512-less runners — the
          # same condition smoke_test reports as SKIP, not FAIL)
          [ -s "$FP/bin/ffmpeg.exe" ] \
            || { echo "ffmpeg.exe MISSING (${{ matrix.target }})"; exit 1; }
          out=$(timeout 30 "$FP/bin/ffmpeg.exe" -version 2>/dev/null | head -1)
          rc=$?
          if [ -n "$out" ]; then
            echo "$out"
          elif [ "$rc" = "124" ]; then
            echo "FAIL: ffmpeg.exe timed out (${{ matrix.target }})"; exit 1
          else
            echo "WARN: ffmpeg.exe exited rc=$rc with no output"
            echo "      (${{ matrix.target }}): possible ISA mismatch;"
            echo "      test the binary on target hw"
            exit 0
          fi
          if compgen -G "$FP/bin/*ggml*" >/dev/null \
            || compgen -G "$FP/bin/*whisper*" >/dev/null; then
            echo "!!! FAIL: ggml/whisper in $FP/bin"
            exit 1
          fi
          echo "OK: no ggml/whisper in $FP/bin"
      - name: Cache FFmpeg install for the mpv job
        uses: actions/cache@v6
        with:
          path: g/media-build/ffmpeg-build/${{ matrix.install_dir }}
          key: ffinst-${{ matrix.target }}-${{ env.CACHE_RUN }}
      - name: Upload FFmpeg build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-${{ matrix.target }}
          path: g/media-build/ffmpeg-build/${{ matrix.install_dir }}/bin
          retention-days: 30
      - name: Upload FFmpeg logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-ffmpeg-${{ matrix.target }}
          path: |
            g/media-build/ffmpeg-build/configure-${{ matrix.target }}.log
            g/media-build/ffmpeg-build/make-${{ matrix.target }}.log
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # build-all.sh STEP 5: mpv per target (exact local script: meson ->
  # ninja -> install -> copydlls.sh -> smoke_test.sh), plus fatal CI
  # verification (locally the smoke test is non-fatal).
  # ==========================================================================
  mpv:
    needs: [deps, ffmpeg, setup]
    runs-on: windows-2025
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Check out mpv-build
        uses: actions/checkout@v6
        with:
          path: g/media-build/mpv-build
      - name: Materialize deps-build + ffmpeg-build from in-repo copies
        shell: bash
        run: |
          set -euo pipefail
          w="$(cygpath -u "$GITHUB_WORKSPACE")/g/media-build"
          cp -r "$w/mpv-build/deps" "$w/deps-build"
          cp -r "$w/mpv-build/ffmpeg-scripts" "$w/ffmpeg-build"
      - name: "Map G: drive"
        shell: pwsh
        run: |
          subst G: "$env:GITHUB_WORKSPACE\g"
          cmd /c dir G:\
      - name: Install MSYS2 CLANG64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            autoconf-wrapper
            automake-wrapper
            libtool
            m4
            make
            bison
            flex
            gperf
            patch
            diffutils
            tar
            curl
            which
            nasm
            yasm
            gettext
          pacboy: >-
            clang:p
            meson:p
            ninja:p
            cmake:p
            nasm:p
            python:p
            rust:p
            cargo-c:p
            cython:p
            pkgconf:p
            gettext-runtime:p
            SDL2:p
            zlib:p
            zstd:p
            vulkan-headers:p
            vulkan-loader:p
            opencl-headers:p
      - name: Restore upstream source clones
        uses: actions/cache@v6
        with:
          path: |
            g/media-build/deps-build/src
            g/media-build/mpv-build/mpv
            g/media-build/mpv-build/libplacebo-src
            g/media-build/ffmpeg-build/ffmpeg
          key: src-${{ env.CACHE_RUN }}
          restore-keys: |
            src-
      - name: Restore target dependency prefix (incl. libplacebo)
        uses: actions/cache@v6
        with:
          path: |
            g/media-build/deps-build/deps-${{ matrix.target }}
            g/media-build/deps-build/src/*/.built-${{ matrix.target }}
          key: dpfx-${{ matrix.target }}-${{ env.CACHE_RUN }}
          restore-keys: |
            dpfx-${{ matrix.target }}-
      - name: Restore per-target FFmpeg install
        uses: actions/cache@v6
        with:
          path: g/media-build/ffmpeg-build/${{ matrix.install_dir }}
          key: ffinst-${{ matrix.target }}-${{ env.CACHE_RUN }}
          restore-keys: |
            ffinst-${{ matrix.target }}-
      - name: Ensure mpv clone exists (cache-miss fallback)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
          if [ ! -d /g/media-build/mpv-build/mpv/.git ]; then
            git clone "$MPV_REPO" /g/media-build/mpv-build/mpv
          fi
      - name: Build mpv (build-all.sh step 5)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export MSYSTEM=CLANG64
          bash /g/media-build/mpv-build/build-${{ matrix.target }}.sh
      - name: Verify mpv (build-all.sh step 6)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # mpv.com, not mpv.exe: the GUI-subsystem binary detaches and
          # would make this check vacuous in a headless CI session.
          MP=/g/media-build/mpv-build/${{ matrix.mpv_dir }}/bin
          out=$(timeout 30 "$MP/mpv.com" --version 2>/dev/null | head -1)
          rc=$?
          if [ -n "$out" ]; then
            echo "$out"
          elif [ "$rc" = "124" ]; then
            echo "FAIL: mpv.com timed out (${{ matrix.target }})"; exit 1
          else
            # rc 132/136 = SIGILL: the binary targets an ISA this
            # runner CPU lacks (e.g. rocketlake AVX-512 on a runner
            # without AVX-512). Not a build defect — the full smoke
            # test below reports the same condition as SKIP not FAIL.
            echo "WARN: mpv.com exited rc=$rc with no output"
            echo "      (${{ matrix.target }}): possible ISA mismatch;"
            echo "      test the binary on target hw"
            exit 0
          fi
          if compgen -G "$MP/*ggml*" >/dev/null \
            || compgen -G "$MP/*whisper*" >/dev/null; then
            echo "!!! FAIL: ggml/whisper in $MP"
            exit 1
          fi
          echo "OK: no ggml/whisper in $MP"
      - name: Smoke test (fatal in CI)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash /g/media-build/mpv-build/smoke_test.sh \
            "/g/media-build/mpv-build/${{ matrix.mpv_dir }}/bin"
      - name: Upload mpv build artifact
        uses: actions/upload-artifact@v6
        with:
          name: mpv-${{ matrix.target }}
          path: g/media-build/mpv-build/${{ matrix.mpv_dir }}/bin
          retention-days: 30
      - name: Upload mpv logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-mpv-${{ matrix.target }}
          path: |
            g/media-build/mpv-build/configure-${{ matrix.target }}.log
            g/media-build/mpv-build/make-${{ matrix.target }}.log
            g/media-build/mpv-build/smoke.log
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # Package + GitHub Release. EVERY successful build posts a release:
  # tag push uses that tag; dispatch uses release_tag or auto-creates
  # build-<UTC stamp>.
  # ==========================================================================
  release:
    needs: mpv
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: "mpv-*"
          path: artifacts
      - name: Resolve release tag
        id: rtag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $env:GITHUB_REF_NAME
          } elseif ($env:RELEASE_TAG) {
            $env:RELEASE_TAG
          } else {
            # manual run without a tag: auto-create a dated release tag
            $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmm')
            "build-$stamp"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Zip per-target portable bundles
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.rtag.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($dir in Get-ChildItem artifacts -Directory) {
            $zip = "dist/$($dir.Name)-$env:RELEASE_TAG.zip"
            Compress-Archive -Path (Join-Path $dir.FullName '*') `
              -DestinationPath $zip -CompressionLevel Optimal
            Write-Host "packed $zip"
          }
          Get-ChildItem dist | Format-Table Name, Length
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rtag.outputs.tag }}
          name: mpv custom builds ${{ steps.rtag.outputs.tag }}
          body: |
            > [!CAUTION]
            > **THESE BINARIES ARE NOT REDISTRIBUTABLE — PERSONAL USE ONLY.**
            >
            > These mpv builds link an FFmpeg configured with
            > `--enable-gpl --enable-version3 --enable-nonfree` (GPL
            > libraries x264/x265/xvid/... plus the **nonfree**
            > Fraunhofer FDK-AAC encoder). The resulting mpv.exe
            > binaries are therefore "nonfree and unredistributable".
            > They are published here solely as a personal build
            > artifact of the repository owner.
            > **Do not mirror, bundle, ship, or redistribute these zips.**

            Self-compiled **mpv** for the selected targets, clang CLANG64
            toolchain, all dependencies built from git masters and
            STATICALLY embedded (libplacebo with libdovi, shaderc,
            spirv-cross, SDL2, libc++). Dolby Vision P7 FEL via the
            native ffmpeg `dovi_split` BSF + libplacebo FEL API.
            Lean bundles: mpv.exe/mpv.com + libmpv-2.dll + vulkan-1.dll +
            the VapourSynth frameserver runtime + portable config.

            Targets (default eight; configurable per-run via the
            `targets` dispatch input — see workflow definition):
            - `mpv-zn3` — Ryzen 5700X3D (znver3) + RTX 5070 (sm_120a)
            - `mpv-zn2` — Zen2 (znver2) + GTX 1650M (Pascal, sm_75)
            - `mpv-11700` — i7-11700 (rocketlake) + RTX 4080 (Ada, sm_89)
            - `mpv-3050` — Zen2 (znver2) + RTX 3050M (Ampere, sm_86)
            - `mpv-14600` — i5-14600 (raptorlake) + RTX 50-series
              (Blackwell, sm_120a)
            - `mpv-x64v2` — generic x86-64-v2 (SSE4.2) + allcuda
            - `mpv-x64v3` — generic x86-64-v3 (AVX2) + allcuda
            - `mpv-x64v4` — generic x86-64-v4 (AVX-512) + allcuda

            The `x64v*` bundles use portable ISA levels (clang concrete
            equivalents of GCC's x86-64-vN) and the allcuda profile: the
            embedded CUDA kernels are PTX 6.3 that the NVIDIA driver
            JIT-compiles to ANY CUDA GPU from Pascal (2016) up.

            Companion FFmpeg builds (ffmpeg/ffplay/ffprobe, incl. Apple
            `aac_at`) release separately at HyperRamzey/ffmpeg-releases.
          generate_release_notes: true
          make_latest: true
          files: dist/*.zip
